<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080808">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>دا ليجيندز | روابطنا</title>

    <meta
        name="description"
        content="جميع روابط وحسابات دا ليجيندز"
    >

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    color-scheme: dark;
    background-color: #080808;
}

html {
    min-height: 100%;
    background: #080808;
    color-scheme: dark;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background-color: #080808;

    background-image:
        radial-gradient(
            circle at 50% 0%,
            #242424 0%,
            #101010 38%,
            #050505 75%
        );

    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #fff;

    display: flex;
    justify-content: center;

    padding-top: max(22px, env(safe-area-inset-top));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(25px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
}


/* CONTAINER */

.container {
    width: 100%;
    max-width: 430px;

    margin: auto;

    text-align: center;
}


/* LOGO */

.logo {
    display: block;

    width: min(205px, 62vw);
    height: auto;

    max-height: 140px;

    object-fit: contain;

    margin: 0 auto 13px;

    filter:
        drop-shadow(
            0 10px 25px rgba(0,0,0,.45)
        );
}


/* TITLE */

h1 {
    font-size: 27px;
    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 14px;
}


/* WELCOME */

.description {
    color: #d2d2d2;

    font-size: 16px;
    line-height: 1.8;

    margin-bottom: 21px;
}

.description .welcome {
    color: #fff;
    font-weight: 600;
}


/* LINKS */

.links {
    display: flex;
    flex-direction: column;

    gap: 10px;
}

.link {
    width: 100%;
    min-height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    padding: 12px 58px;

    border-radius: 15px;

    background: rgba(255,255,255,.065);

    border: 1px solid rgba(255,255,255,.12);

    color: #fff;

    text-decoration: none;

    font-size: 16px;
    font-weight: 600;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 7px 22px rgba(0,0,0,.20);

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.link:hover {
    transform: translateY(-2px);
}

.link:active {
    transform: scale(.985);
}


/* ICONS */

.icon {
    position: absolute;

    right: 19px;

    width: 22px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.icon svg {
    display: block;

    width: 100%;
    height: 100%;

    fill: currentColor;
}


/* WEBSITE */

.website {
    background: #fff;
    color: #080808;
    border-color: #fff;
}

.website:hover,
.website:active {
    background: #ededed;

    box-shadow:
        0 7px 25px rgba(255,255,255,.08);
}


/* INSTAGRAM */

.instagram:hover,
.instagram:active {
    border-color: #e1306c;
    background: rgba(225,48,108,.13);
}


/* TIKTOK */

.tiktok:hover,
.tiktok:active {
    border-color: #25f4ee;
    background: rgba(37,244,238,.09);
}


/* YOUTUBE */

.youtube:hover,
.youtube:active {
    border-color: #ff0000;
    background: rgba(255,0,0,.11);
}


/* TELEGRAM */

.telegram:hover,
.telegram:active {
    border-color: #229ed9;
    background: rgba(34,158,217,.12);
}


/* WHATSAPP */

.whatsapp:hover,
.whatsapp:active {
    border-color: #25d366;
    background: rgba(37,211,102,.11);
}


/* EMAIL */

.email:hover,
.email:active {
    border-color: #aaa;
    background: rgba(255,255,255,.10);
}


/* FOOTER */

.footer {
    margin-top: 21px;

    color: #666;

    font-size: 12px;

    padding-bottom:
        env(safe-area-inset-bottom);
}


/* MOBILE */

@media (max-width: 480px) {

    body {
        padding-left:
            max(14px, env(safe-area-inset-left));

        padding-right:
            max(14px, env(safe-area-inset-right));
    }

    .logo {
        width: min(190px, 57vw);
        margin-bottom: 10px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 12px;
    }

    .description {
        margin-bottom: 18px;
    }

    .links {
        gap: 9px;
    }

    .link {
        min-height: 52px;
        border-radius: 14px;
    }

    .footer {
        margin-top: 18px;
    }
}


/* SHORT PHONE SCREENS */

@media
(max-height: 750px)
and
(max-width: 480px) {

    body {
        padding-top:
            max(15px, env(safe-area-inset-top));
    }

    .logo {
        width: 165px;
        margin-bottom: 7px;
    }

    h1 {
        font-size: 23px;
        margin-bottom: 8px;
    }

    .description {
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 13px;
    }

    .links {
        gap: 7px;
    }

    .link {
        min-height: 48px;
    }

    .footer {
        margin-top: 13px;
    }
}

</style>
</head>


<body>

                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12l-6.2 3.6z"/>

        <a

                <svg viewBox="0 0 24 24">
                    <path d="M21.9 3.2 18.6 20c-.25 1.18-.9 1.47-1.83.92l-5.03-3.7-2.43 2.34c-.27.27-.5.5-1.02.5l.36-5.12 9.32-8.42c.4-.36-.09-.56-.63-.2L5.82 13.58.86 12.03c-1.08-.34-1.1-1.08.22-1.6L20.48 2.95c.9-.33 1.69.2 1.42.25z"/>

                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        صُنع بواسطة دا ليجيندز • ٢٠٢٦
    </div>


</main>

</body>
</html>
