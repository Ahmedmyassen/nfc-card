```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DaLegends | روابط التواصل</title>
  <meta name="description" content="جميع روابط وحسابات DaLegends في مكان واحد">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, #272727 0%, #101010 45%, #050505 100%);
      color: white;
      display: flex;
      justify-content: center;
      padding: 35px 18px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.9);
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .username {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .description {
      color: #d1d1d1;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 auto 28px;
      max-width: 360px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 14px 50px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      transition: .2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.28);
    }

    .link:active {
      transform: scale(.98);
    }

    .icon {
      position: absolute;
      right: 18px;
      font-size: 22px;
    }

    .primary {
      background: white;
      color: #111;
    }

    .primary:hover {
      background: #eeeeee;
    }

    footer {
      color: #666;
      font-size: 12px;
      margin-top: 35px;
    }
  </style>
</head>

<body>

  <main class="container">

    <!--
      ارفع صورتك باسم logo.png
      في نفس مكان index.html
    -->
    <img class="logo" src="logo.png" alt="DaLegends Logo">

    <h1>DaLegends</h1>

    <div class="username">@DaLegends</div>

    <p class="description">
      أهلاً بك 👋
      <br>
      جميع حساباتي وروابطي في مكان واحد.
    </p>

    <div class="links">

      <!-- غيّر الروابط الموجودة بالأسفل إلى روابطك -->

      <a class="link primary"
         href="https://dalegends.com"
         target="_blank">
        <span class="icon">🌐</span>
        الموقع الرسمي
      </a>

      <a class="link"
         href="https://instagram.com/USERNAME"
         target="_blank">
        <span class="icon">📸</span>
        Instagram
      </a>

      <a class="link"
         href="https://tiktok.com/@USERNAME"
         target="_blank">
        <span class="icon">🎵</span>
        TikTok
      </a>

      <a class="link"
         href="https://youtube.com/@USERNAME"
         target="_blank">
        <span class="icon">▶️</span>
        YouTube
      </a>

      <a class="link"
         href="https://t.me/USERNAME"
         target="_blank">
        <span class="icon">✈️</span>
        Telegram
      </a>

      <a class="link"
         href="https://wa.me/9665XXXXXXXX"
         target="_blank">
        <span class="icon">💬</span>
        WhatsApp
      </a>

      <a class="link"
         href="mailto:YOUR@email.com">
        <span class="icon">✉️</span>
        Email
      </a>

    </div>

    <footer>
      © 2026 DaLegends
    </footer>

  </main>

</body>
</html>
